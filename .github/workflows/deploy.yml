name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            /home/deploy/deploy-sisprof.sh
            
            # Limpieza exhaustiva de cache, migraciones y permisos en la aplicacion
            APP_DIR="/var/www/sisprof.aulanova.org/sis.estructurasycoberturas.com"
            if [ -d "$APP_DIR" ]; then
              cd "$APP_DIR"
              mkdir -p database/tenants storage/logs storage/framework/views storage/framework/cache storage/framework/sessions
              php artisan migrate --force || true
              php artisan optimize:clear || true
              php artisan view:clear || true
              rm -f storage/framework/views/*.php || true
              chmod -R a+rwX database storage bootstrap/cache 2>/dev/null || true
              sudo chown -R www-data:www-data database storage bootstrap/cache 2>/dev/null || true
              sudo chmod -R 775 database storage bootstrap/cache 2>/dev/null || true
            fi
            
            # Reset de OPcache mediante peticion web local y reload de servicio
            curl -k -s "https://sisprof.aulanova.org/clear-opcache.php" || true
            sudo systemctl reload php*-fpm 2>/dev/null || sudo service php*-fpm reload 2>/dev/null || true
